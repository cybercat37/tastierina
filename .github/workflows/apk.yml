name: APK

# Tests the Rust engine, builds it for Android, builds the app and publishes
# the APK as a release. Builds from main are the latest release; builds from
# other branches are pre-releases, to try on the phone before merging.
on:
  push:
    branches: [main, native]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Rust toolchain and Android targets
        run: |
          rustup toolchain install stable --profile minimal
          rustup default stable
          rustup target add aarch64-linux-android armv7-linux-androideabi x86_64-linux-android

      - name: Test the engine
        run: cargo test -p engine

      - name: Build the engine for Android
        run: |
          NDK="${ANDROID_NDK_LATEST_HOME:-$ANDROID_NDK_HOME}"
          BIN="$NDK/toolchains/llvm/prebuilt/linux-x86_64/bin"
          echo "NDK: $NDK"
          export CARGO_TARGET_AARCH64_LINUX_ANDROID_LINKER="$BIN/aarch64-linux-android26-clang"
          export CARGO_TARGET_ARMV7_LINUX_ANDROIDEABI_LINKER="$BIN/armv7a-linux-androideabi26-clang"
          export CARGO_TARGET_X86_64_LINUX_ANDROID_LINKER="$BIN/x86_64-linux-android26-clang"
          for pair in aarch64-linux-android:arm64-v8a armv7-linux-androideabi:armeabi-v7a x86_64-linux-android:x86_64; do
            triple="${pair%%:*}"
            abi="${pair##*:}"
            cargo build -p engine-android --release --target "$triple"
            mkdir -p "app/src/main/jniLibs/$abi"
            cp "target/$triple/release/libtastierina.so" "app/src/main/jniLibs/$abi/"
          done
          ls -l app/src/main/jniLibs/*

      - uses: gradle/actions/setup-gradle@v4

      - name: Build the APK
        run: ./gradlew assembleRelease --no-daemon --stacktrace
        env:
          VERSION_CODE: ${{ github.run_number }}

      - name: Name the file
        run: cp app/build/outputs/apk/release/app-release.apk "Tastierina-2.0.${{ github.run_number }}.apk"

      - name: Publish the release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v2.0.${{ github.run_number }}
          target_commitish: ${{ github.sha }}
          name: Tastierina 2.0.${{ github.run_number }}${{ github.ref_name != 'main' && format(' (prova, {0})', github.ref_name) || '' }}
          prerelease: ${{ github.ref_name != 'main' }}
          make_latest: ${{ github.ref_name == 'main' && 'true' || 'false' }}
          files: Tastierina-2.0.${{ github.run_number }}.apk
          body: |
            App nativa: motore audio in Rust su AAudio, interfaccia in Kotlin e Compose.
            Scarica il file .apk qui sotto dal telefono e aprilo per installarlo.
            Si installa sopra la versione precedente.
