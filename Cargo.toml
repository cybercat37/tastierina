[workspace]
members = ["engine", "engine-android", "engine-cli"]
resolver = "2"

[workspace.package]
edition = "2021"
version = "0.1.0"
license = "MIT"

# Panics must never unwind across the audio callback or JNI.
[profile.release]
opt-level = 3
lto = "thin"
panic = "abort"
strip = true
codegen-units = 1

[profile.dev]
panic = "abort"
