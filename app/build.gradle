plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android'
    id 'org.jetbrains.kotlin.plugin.compose'
}

// GitHub Actions passes its run number, so every build installs as an update of the previous one.
def buildNumber = Integer.parseInt(System.getenv('VERSION_CODE') ?: '1')

android {
    namespace = 'it.tastierina.app'
    compileSdk = 35

    defaultConfig {
        applicationId = 'it.tastierina.app'
        minSdk = 26          // AAudio
        targetSdk = 35
        versionCode = 100 + buildNumber
        versionName = "2.0." + buildNumber
    }

    // One fixed key, kept in the repository, so that a new build replaces the old one
    // without uninstalling. It is meant for personal installs, not for the Play Store.
    signingConfigs {
        shared {
            storeFile = file('tastierina.keystore')
            storeType = 'pkcs12'
            storePassword = 'tastierina'
            keyAlias = 'tastierina'
            keyPassword = 'tastierina'
        }
    }

    buildTypes {
        release {
            minifyEnabled = false
            signingConfig = signingConfigs.shared
        }
        debug {
            signingConfig = signingConfigs.shared
        }
    }

    // The Rust engine (libtastierina.so) is copied by CI into src/main/jniLibs/<abi>/
    // after `cargo build`; that folder is not committed.

    buildFeatures {
        compose = true
    }

    compileOptions {
        sourceCompatibility = JavaVersion.VERSION_17
        targetCompatibility = JavaVersion.VERSION_17
    }

    kotlinOptions {
        jvmTarget = '17'
    }
}

dependencies {
    implementation platform('androidx.compose:compose-bom:2024.12.01')
    implementation 'androidx.compose.ui:ui'
    implementation 'androidx.compose.foundation:foundation'
    implementation 'androidx.compose.material3:material3'
    implementation 'androidx.activity:activity-compose:1.9.3'
    implementation 'androidx.core:core-ktx:1.13.1'
}
